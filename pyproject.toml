[project]
name = "star-pulse"
version = "0.1.0"
description = "Pipeline de data engineering mesurant la ponctualité du réseau de bus STAR (Rennes) à partir des flux GTFS / GTFS-RT."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.44.9",
    "confluent-kafka>=2.16.2",
    "dagster>=1.13.31",
    "dagster-dbt>=0.29.31",
    "dbt-duckdb>=1.10",
    "duckdb>=2.0.1",
    "gtfs-realtime-bindings>=1.0,<3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16",
    "streamlit>=1.67.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.9",
    "dagster-webserver>=1.13.31",
    "mypy>=2.4",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "ruff>=0.17",
    "types-protobuf>=6.32,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/star_pulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "N",        # pep8-naming
    "PTH",      # pathlib plutôt que os.path
    "T20",      # pas de print
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pydeck (carte du dashboard) ne publie pas de types.
module = ["pydeck.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: tests nécessitant l'infra Docker (make up)",
]
# Avertissements de dépendances tierces (dbt, Dagster), hors de notre code.
filterwarnings = [
    "ignore::DeprecationWarning:sqlglotrs",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::SyntaxWarning:parsedatetime",
]
