# Profil DuckDB local. Les valeurs viennent de l'environnement : lancer dbt via
# `make dbt-build` (wrapper Python qui lit `.env`) plutôt que `dbt` directement.
star_pulse:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('STAR_PULSE_DUCKDB_PATH', '../data/star_pulse.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
      secrets:
        - type: s3
          key_id: "{{ env_var('STAR_PULSE_S3_ACCESS_KEY', 'minioadmin') }}"
          secret: "{{ env_var('DBT_ENV_SECRET_S3_SECRET_KEY', 'minioadmin') }}"
          region: "{{ env_var('STAR_PULSE_S3_REGION', 'us-east-1') }}"
          endpoint: "{{ env_var('STAR_PULSE_DBT_S3_ENDPOINT', 'localhost:9000') }}"
          use_ssl: "{{ env_var('STAR_PULSE_DBT_S3_USE_SSL', 'False') | as_bool }}"
          url_style: path
      external_root: "s3://{{ env_var('STAR_PULSE_S3_BUCKET', 'lake') }}/silver"
