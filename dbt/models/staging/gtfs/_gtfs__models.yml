version: 2

models:
  - name: stg_gtfs__feed_versions
    description: Versions du GTFS théorique présentes en bronze, avec leur date d'ingestion.
    columns:
      - name: gtfs_version
        description: Empreinte (sha256 tronqué) du contenu du GTFS.
        data_tests: [unique, not_null]
      - name: ingested_on
        data_tests: [not_null]

  - name: stg_gtfs__routes
    description: Lignes du réseau, typées.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gtfs_version, route_id]
    columns:
      - name: route_id
        data_tests: [not_null]

  - name: stg_gtfs__stops
    description: Arrêts du réseau, coordonnées en degrés décimaux.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gtfs_version, stop_id]
    columns:
      - name: stop_id
        data_tests: [not_null]
      - name: stop_lat
        data_tests:
          - value_between:
              arguments: {min_value: 47.5, max_value: 48.6}

  - name: stg_gtfs__trips
    description: Courses théoriques.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gtfs_version, trip_id]
    columns:
      - name: trip_id
        data_tests: [not_null]
      - name: route_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_gtfs__routes')
                field: route_id
      - name: service_id
        data_tests: [not_null]

  - name: stg_gtfs__stop_times
    description: >
      Horaires théoriques. Les heures sont en secondes depuis le début du jour de
      service et peuvent dépasser 86 400 (courses après minuit).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gtfs_version, trip_id, stop_sequence]
    columns:
      - name: trip_id
        data_tests: [not_null]
      - name: stop_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_gtfs__stops')
                field: stop_id
      - name: arrival_offset_s
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 172800}

  - name: stg_gtfs__calendar
    description: Calendriers réguliers (jours de semaine et période de validité).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gtfs_version, service_id]

  - name: stg_gtfs__calendar_dates
    description: Exceptions de calendrier (1 = ajout, 2 = suppression).
    columns:
      - name: exception_type
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
